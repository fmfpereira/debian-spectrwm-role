# debian spectrwm setup vars.

# Default git username and email
git:
  user_name: 'git'
  user_mail: 'git@gitlab.com'

# Default user folders and paths to include on the PATH environment variable
profile:
  path:
    - '.bin'
    - '.config/composer/vendor/bin'
    - 'Applications'
    - 'Scripts'