# debian spectrwm settings.

# Window Decoration
border_width        = 1
color_focus         = rgb:1d/35/57
tile_gap            = 5

# Bar Settings
bar_font_color[]    = rgb:ff/ff/ff, rgb:c7/00/00, rgb:56/8c/3b, rgb:8a/8a/0f , rgb:25/7f/ad , rgb:5d/5d/b1 , rgb:2d/8f/6f , rgb:7e/a2/b4 
bar_font            = Hasklug Nerd Font:size=11
bar_action          = ~/Scripts/baraction.sh
bar_action_expand   = 1
bar_justify         = left
bar_format          = +|L+N:+I +S +D +4<%a %b %d %R %Z %Y+8<+|R+A

# Workspace Settings
workspace_limit     = 22

# Set workspace name at start
name                = ws[1]: Browser  
name                = ws[2]: Terminal 
name                = ws[3]: PHPStorm
name                = ws[4]: Social
name                = ws[5]: Filemanager
name                = ws[6]: Misclaneous
name                = ws[7]: Misclaneous
name                = ws[8]: Misclaneous
name                = ws[9]: Misclaneous
name                = ws[10]: Misclaneous
name                = ws[11]: Browser
name                = ws[12]: Terminal
name                = ws[13]: PHPStorm
name                = ws[14]: Social
name                = ws[15]: Filemanager
name                = ws[16]: Misclaneous
name                = ws[17]: Misclaneous
name                = ws[18]: Misclaneous
name                = ws[19]: Misclaneous
name                = ws[20]: Misclaneous
name                = ws[21]: Misclaneous
name                = ws[22]: Misclaneous

# Mod key, (Windows key is Mod4) (Apple key on OSX is Mod2)
modkey              = Mod4

# PROGRAMS
# Validated default programs:
program[lock]       = blurlock
program[term]       = rxvt-unicode
program[menu]       = rofi -hide-scrollbar -theme fmfpereira -show run
