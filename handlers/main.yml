# debian spectrwm setup handlers.

- name: Set default git user name
  ansible.builtin.command: 'git config --global user.name {{ git.user_name }}'

- name: Set default git user mail
  ansible.builtin.command: 'git config --global user.mail {{ git.user_mail }}'

- name: Print default git user
  ansible.builtin.debug:
    msg: "Default git user.name: {{ git.user_name }} and user.mail: {{ git.user_mail }}"

- name: Copy spectrwm.conf file
  copy:
    src: 'spectrwm'
    dest: '~/.config/'

- name: Copy .Xresources file
  copy:
    src: 'Xresources'
    dest: '~/.Xresources'

- name: Copy .xsessionrc file
  ansible.builtin.copy:
    src: 'xsessionrc'
    dest: '~/.xsessionrc'

- name: Copy rofi theme
  ansible.builtin.copy:
    src: 'rofi'
    dest: '~/.config/'

- name: Copy gtk settings
  ansible.builtin.copy:
    src: 'gtk-3.0'
    dest: '~/.config/'

- name: Install Ubuntu Mono nerd font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/v2.1.0/UbuntuMono.zip
    dest: /usr/local/share/fonts
    remote_src: yes
    mode: 0644
  become: yes

- name: Install Mononoki nerd font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/v2.1.0/Mononoki.zip
    dest: /usr/local/share/fonts
    remote_src: yes
    mode: 0644
  become: yes

- name: Install Hasklug nerd font
  ansible.builtin.unarchive:
    src: https://github.com/ryanoasis/nerd-fonts/releases/download/v2.1.0/Hasklig.zip
    dest: /usr/local/share/fonts
    remote_src: yes
    mode: 0644
  become: yes

- name: Update PATH environment variable
  ansible.builtin.blockinfile:
    path: ~/.profile
    marker: "{mark} ANSIBLE MANAGED BLOCK | {{ item }} PATH"
    marker_begin: '\n# BEGIN'
    marker_end: '# END'
    block: |
      # set PATH so it includes {{ item }} if it exists
      if [ -d "$HOME/{{ item }}" ] ; then
          PATH="$HOME/{{ item }}:$PATH"
      fi
  loop: "{{ profile.path }}"