# debian spectrwm setup.

- name: Install base software
  apt:
    name:
      - alsa-utils
      - curl
      - firmware-linux
      - firmware-linux-nonfree
      - imagemagick
      - locate
      - mesa-utils
      - nvidia-detect
      - pavucontrol
      - pulseaudio
      - unzip
      - xinit
      - xorg
      - xserver-xorg
      - xutils
    state: present
  become: yes
  notify: Update PATH environment variable
