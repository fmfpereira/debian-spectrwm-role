# debian spectrwm docker setup.

- name: Install docker
  apt:
    name:
      - docker
      - docker-compose
    state: present
  become: yes

- name: Add current user to the docker group
  user:
    name: "{{ lookup('env', 'USER') }}"
    groups: docker
    append: yes
  become: yes
  
- name: Restart docker service
  service:
    name: docker
    state: restarted
  become: yes