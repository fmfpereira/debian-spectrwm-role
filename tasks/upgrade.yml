# debian spectrwm update/upgrade setup.

- name: Add non-free and contrib repositories
  ansible.builtin.replace:
    path: /etc/apt/sources.list
    regexp: ' main$'
    replace: ' main contrib non-free'
  become: yes

- name: Full system upgrade
  apt:
    update_cache: yes
    upgrade: yes
  become: yes


